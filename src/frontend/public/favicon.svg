<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded square background in Tabletalk crimson -->
  <rect width="32" height="32" rx="7" fill="#be123c"/>
  <!-- Serif-style T: horizontal cap bar -->
  <rect x="7.5" y="8" width="17" height="3.5" rx="1.5" fill="white"/>
  <!-- Vertical stem -->
  <rect x="13" y="8" width="6" height="15.5" rx="2" fill="white"/>
  <!-- Small accent dot below stem (the Tabletalk dot motif) -->
  <circle cx="16" cy="26" r="1.75" fill="rgba(255,255,255,0.7)"/>
</svg>
